name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --root-dir "$(pwd)/dist" --exclude '^http://localhost' --exclude 'linkedin.com' --no-progress 'dist/**/*.html'
          fail: true
